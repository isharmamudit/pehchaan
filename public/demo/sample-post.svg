<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Illustration of a family outside a house gate with a visible house number and a school badge">
  <rect width="1200" height="900" fill="#cfe3f0"/>
  <rect y="620" width="1200" height="280" fill="#b9cfae"/>
  <!-- house -->
  <rect x="120" y="230" width="560" height="400" fill="#e8ded0"/>
  <polygon points="100,235 700,235 400,120" fill="#9c6b4f"/>
  <rect x="300" y="400" width="140" height="230" fill="#7a5235"/>
  <rect x="520" y="330" width="110" height="110" fill="#9fc6dd"/>
  <!-- gate with house number -->
  <rect x="150" y="470" width="120" height="160" fill="#8a8f98"/>
  <rect x="160" y="480" width="100" height="60" fill="#ffffff"/>
  <text x="210" y="528" font-family="Arial, sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#1d2530">42</text>
  <text x="210" y="572" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">Rose Colony</text>
  <!-- street sign -->
  <rect x="930" y="300" width="30" height="330" fill="#6b7280"/>
  <rect x="820" y="270" width="250" height="60" fill="#1f5f3f"/>
  <text x="945" y="310" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#ffffff">Rose Colony Rd</text>
  <!-- adult -->
  <circle cx="760" cy="470" r="42" fill="#d8a173"/>
  <rect x="722" y="515" width="80" height="150" rx="16" fill="#4a6fa5"/>
  <!-- child in uniform with school badge -->
  <circle cx="860" cy="520" r="34" fill="#e0b183"/>
  <rect x="830" y="556" width="62" height="110" rx="12" fill="#ffffff"/>
  <rect x="830" y="556" width="62" height="18" fill="#9b1c2e"/>
  <circle cx="846" cy="594" r="15" fill="#9b1c2e"/>
  <text x="846" y="599" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">SPS</text>
  <text x="861" y="640" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1d2530">SUNRISE PUBLIC SCHOOL</text>
  <!-- scooter plate -->
  <rect x="120" y="700" width="180" height="90" rx="12" fill="#3f4b5b"/>
  <rect x="150" y="760" width="120" height="30" fill="#ffffff"/>
  <text x="210" y="783" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">DL 3C XX 1947</text>
</svg>
